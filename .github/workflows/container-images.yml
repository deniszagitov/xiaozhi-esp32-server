name: Build source containers

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'main/**'
      - 'docs/docker/**'
      - 'Dockerfile-*'
      - 'requirements-container.txt'
      - '.dockerignore'
      - '.github/workflows/container-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            dockerfile: Dockerfile-server-cpu
          - component: web
            dockerfile: Dockerfile-web
          - component: ddgs
            dockerfile: main/xiaozhi-server/mcp/ddgs/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ matrix.component }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}-cpu
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-cpu
      - name: Record immutable image
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "${COMPONENT} ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
